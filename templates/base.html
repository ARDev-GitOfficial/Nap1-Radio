{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Rádio Cipó{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'imagens/logo-radio-cipo.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container navegacao">
            <a class="navbar-brand" href="{% url 'radio:index' %}"><img src="{% static 'imagens/logo-radio-cipo.png' %}" alt="Rádio Cipó"></a>
            <div>
                <a class="link-light me-3" href="{% url 'radio:index' %}">Início</a> <a class="link-light" href="{% url 'radio:pedidos' %}">Pedir música</a>
            </div>
        </div>
    </nav>

    <main class="container conteudo">
        {% for message in messages %}
        <p class="mensagem text-center" role="status">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>

    <footer class="container text-center">Rádio Cipó</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
